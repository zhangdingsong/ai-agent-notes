<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent &amp; LLM 笔记专栏</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #0f766e;
    }
    .markdown-section {
      max-width: 860px;
      padding: 30px 24px 60px;
    }
    .markdown-section img {
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }
    .demo-embed-wrap {
      margin: 16px 0 24px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }
    .demo-embed-wrap iframe {
      width: 100%;
      border: none;
      display: block;
    }
    .mermaid {
      text-align: center;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div id="app">加载笔记中...</div>
  <script>
    const DEMO_HEIGHTS = {
      'llm-inference.html': 680,
      'react-loop.html': 440,
      'agent-tools.html': 340
    };

    window.$docsify = {
      name: 'AI Agent 笔记专栏',
      repo: 'zhangdingsong/ai-agent-notes',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      plugins: [
        function (hook, vm) {
          // 0. Automatically inject filename as H1 title for Obsidian notes that lack an H1
          hook.beforeEach(function (content) {
            const file = (vm.route && vm.route.file) || '';
            if (file.startsWith('notes/') && !/^#\s+/m.test(content.trimStart().split('\n')[0] || '')) {
              const rawName = decodeURIComponent(file.replace(/^notes\//, '').replace(/\.md$/i, ''));
              return '# ' + rawName + '\n\n' + content;
            }
            return content;
          });

          // 1. Automatically turn demo links inside notes into inline interactive iframes
          hook.doneEach(function () {
            const container = document.querySelector('.markdown-section');
            if (!container) return;

            const links = container.querySelectorAll('a[href*="demos/"]');
            const seen = new Set();
            links.forEach(function (a) {
              const href = a.getAttribute('href') || '';
              const match = href.match(/demos\/([a-z0-9-]+\.html)/i);
              if (!match) return;
              const file = match[1];
              if (seen.has(file)) return;
              seen.add(file);

              const block = a.closest('p, li, blockquote') || a;
              if (block.nextElementSibling && block.nextElementSibling.classList.contains('demo-embed-wrap')) return;

              const wrap = document.createElement('div');
              wrap.className = 'demo-embed-wrap';
              const iframe = document.createElement('iframe');
              iframe.src = 'demos/' + file;
              iframe.height = DEMO_HEIGHTS[file] || 460;
              iframe.loading = 'lazy';
              wrap.appendChild(iframe);
              block.insertAdjacentElement('afterend', wrap);
            });

            // 2. Render Mermaid diagrams
            if (window.mermaid) {
              const codeBlocks = container.querySelectorAll('pre[data-lang="mermaid"]');
              codeBlocks.forEach(function (pre, idx) {
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = pre.textContent;
                pre.replaceWith(div);
              });
              window.mermaid.run({ querySelector: '.mermaid' });
            }
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
  </script>
</body>
</html>

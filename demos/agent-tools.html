<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG · MCP · Subagent 交互实验室</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8fafc;
      --border: #e2e8f0;
      --fg: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-fg: #ffffff;
      --err: #dc2626;
      --sec: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --primary: #2dd4bf;
        --primary-fg: #0f172a;
        --err: #f87171;
        --sec: #0b1120;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .btn-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    button {
      font-family: inherit; font-size: 12px; padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--card); color: var(--fg);
      cursor: pointer; transition: all 0.15s;
    }
    button.active { background: var(--primary); color: var(--primary-fg); border-color: transparent; font-weight: 600; }
    button.good-on { border-color: var(--primary); color: var(--primary); background: var(--sec); font-weight: 600; }
    button.bad-on { border-color: var(--err); color: var(--err); background: var(--sec); font-weight: 600; }
    .stage {
      padding: 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); display: flex; flex-direction: column; gap: 10px;
    }
    .stage-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
    .badge {
      font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700;
      padding: 3px 8px; border-radius: 6px; background: var(--sec);
    }
    .stat { font-size: 12px; font-weight: 600; }
    .good { color: var(--primary); }
    .bad { color: var(--err); }
    .title { font-size: 15px; font-weight: 700; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .cols { grid-template-columns: 1fr; } }
    .box { padding: 12px; border-radius: 8px; background: var(--sec); display: flex; flex-direction: column; gap: 5px; }
    .box.accent-good { border: 1px solid var(--primary); }
    .box.accent-bad { border: 1px solid var(--err); }
    .box-title { font-size: 12px; font-weight: 700; }
    .item { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .desc { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.55; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="btn-group">
        <button id="tab-rag" onclick="setTab('rag')">📚 1. RAG 外挂知识库</button>
        <button id="tab-mcp" onclick="setTab('mcp')">🔌 2. MCP 万能插座</button>
        <button id="tab-sub" onclick="setTab('sub')">👥 3. Subagent 分身</button>
      </div>
      <div class="btn-group">
        <button id="mode-bad" onclick="setMode(false)">❌ 传统痛点</button>
        <button id="mode-good" onclick="setMode(true)">✅ 用上之后</button>
      </div>
    </div>
    <div id="stage" class="stage"></div>
  </div>

  <script>
    let curTab = 'rag';
    let isGood = true;

    const DATA = {
      rag: {
        bad: {
          badge: '没有 RAG · 硬塞全文',
          title: '把 500 页公司手册全塞进上下文黑板',
          leftTitle: '📦 全部资料（50 万 token）',
          leftItems: ['第1章 考勤制度...', '第2章 报销流程...', '...中间省略 490 页...', '第48章 差旅标准...'],
          rightTitle: '😵 主黑板状态',
          rightStat: '费用爆表 · 容易遗忘中间内容',
          desc: '每次问一个小问题都要把整本手册重读一遍，不仅贵、首字等半天，还容易出现“中间遗忘（Lost in the Middle）”。'
        },
        good: {
          badge: '开启 RAG · 先搜再答',
          title: '先去向量库翻书，只把最相关的 3 段放上黑板',
          leftTitle: '🔍 检索引擎（找第 12 页）',
          leftItems: ['问题：“打车怎么报销？”', '命中片段 1：市内打车需电子发票', '命中片段 2：单次上限 100 元'],
          rightTitle: '✨ 主黑板状态',
          rightStat: '只占 ~600 token · 又快又准',
          desc: 'RAG 就是给 AI 配了一个“图书管理员”：先精准抽出相关段落，再喂给 ReAct 循环去回答，省钱 99% 且有据可查。'
        }
      },
      mcp: {
        bad: {
          badge: '没有 MCP · M×N 混乱接法',
          title: '每换一个 AI 工具，所有插件都要重写一遍',
          leftTitle: '🤖 3 个 AI 客户端',
          leftItems: ['Antigravity 要写一套 GitHub 接口', 'Claude Code 要写另一套', 'Cursor 又要再写一套'],
          rightTitle: '🔧 维护噩梦',
          rightStat: '3 × 4 = 12 套重复胶水代码',
          desc: '以前各家 Agent 工具调用格式五花八门，接 GitHub、Notion、数据库全要单独适配，开发者累死。'
        },
        good: {
          badge: '统一 MCP · USB-C 标准插座',
          title: '一套标准协议，所有 AI 客户端即插即用',
          leftTitle: '🔌 统一 MCP 协议层',
          leftItems: ['GitHub MCP Server（写一次）', 'Notion MCP Server（写一次）', 'Postgres MCP Server（写一次）'],
          rightTitle: '⚡ 生态爆发',
          rightStat: '任意支持 MCP 的 AI 直接插上就能用',
          desc: 'MCP（Model Context Protocol）规定了“工具怎么自我介绍、怎么被调用”。就像 USB-C，接上插座就能识别。'
        }
      },
      sub: {
        bad: {
          badge: '单兵 Agent · 一块黑板干到底',
          title: '1 个 Agent 既要查 20 个文件，又要改代码写测试',
          leftTitle: '🧱 单一黑板（塞满杂物）',
          leftItems: ['搜文件1..15 的几万行日志', '查网页返回的冗长 HTML', '前面写的代码被挤出记忆...'],
          rightTitle: '💥 常见翻车',
          rightStat: '上下文污染 · 越干越糊涂',
          desc: '所有中间搜集的垃圾信息都留在同一块黑板上，主大脑被噪音淹没，开始忘记最初要干嘛、甚至重复出错。'
        },
        good: {
          badge: 'Subagent · 团队分工隔离黑板',
          title: '主 Agent 当经理，派子 Agent 在独立黑板干活',
          leftTitle: '🤖 各自独立的小黑板',
          leftItems: ['子Agent A（调研）：翻完 20 个文件 → 只汇报“问题在第8行”', '子Agent B（写测试）：跑完测试 → 只汇报“全部通过”'],
          rightTitle: '🧠 主 Agent 黑板',
          rightStat: '只收干净结论 · 清爽不串台',
          desc: '每个 Subagent 内部跑着自己的 ReAct Loop，干完活把过程噪音扔掉，只把最终摘要交回主 Agent，复杂任务稳得多。'
        }
      }
    };

    function setTab(t) { curTab = t; render(); }
    function setMode(good) { isGood = good; render(); }

    function render() {
      ['rag', 'mcp', 'sub'].forEach(t => {
        document.getElementById('tab-' + t).className = curTab === t ? 'active' : '';
      });
      document.getElementById('mode-bad').className = !isGood ? 'bad-on' : '';
      document.getElementById('mode-good').className = isGood ? 'good-on' : '';

      const d = DATA[curTab][isGood ? 'good' : 'bad'];
      const cls = isGood ? 'good' : 'bad';

      document.getElementById('stage').innerHTML = `
        <div class="stage-head">
          <span class="badge ${cls}">${d.badge}</span>
          <span class="stat ${cls}">${d.rightStat}</span>
        </div>
        <div class="title">${d.title}</div>
        <div class="cols">
          <div class="box">
            <div class="box-title">${d.leftTitle}</div>
            ${d.leftItems.map(x => `<div class="item">• ${x}</div>`).join('')}
          </div>
          <div class="box accent-${cls}">
            <div class="box-title ${cls}">${d.rightTitle}</div>
            <p class="desc">${d.desc}</p>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini ReAct Agent 报文与源码实验室</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8fafc;
      --border: #e2e8f0;
      --fg: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-fg: #ffffff;
      --err: #dc2626;
      --err-bg: #fef2f2;
      --sec: #f1f5f9;
      --sec-fg: #1e293b;
      --code-bg: #0f172a;
      --code-fg: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --primary: #2dd4bf;
        --primary-fg: #0f172a;
        --err: #f87171;
        --err-bg: #450a0a;
        --sec: #0b1120;
        --sec-fg: #e2e8f0;
        --code-bg: #090d16;
        --code-fg: #e2e8f0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px 16px; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13.5px; line-height: 1.5;
    }
    .wrap { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .btn-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    button {
      font-family: inherit; font-size: 12px; padding: 5px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--card); color: var(--fg);
      cursor: pointer; transition: all 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.88; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.active, button.primary {
      background: var(--primary); color: var(--primary-fg); border-color: transparent; font-weight: 600;
    }
    button.danger {
      border-color: var(--err); color: var(--err); font-weight: 600;
    }
    button.danger.on {
      background: var(--err); color: #fff; border-color: transparent;
    }
    .badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
      padding: 2px 7px; border-radius: 5px; background: var(--sec); color: var(--muted);
    }
    .cols { display: grid; grid-template-columns: 5fr 7fr; gap: 10px; }
    @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
    .panel {
      padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); display: flex; flex-direction: column; gap: 8px;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .tag {
      font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 700;
      padding: 2px 8px; border-radius: 5px; background: var(--sec); color: var(--primary);
    }
    .title { font-size: 14.5px; font-weight: 700; }
    .desc { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.55; }
    .note-box {
      padding: 8px 10px; border-radius: 7px; background: var(--sec);
      border-left: 3px solid var(--primary); font-size: 12px; line-height: 1.5;
    }
    .err-box {
      padding: 9px 10px; border-radius: 7px; background: var(--err-bg);
      border: 1px solid var(--err); color: var(--err); font-size: 12px; font-family: ui-monospace, monospace;
    }
    pre {
      margin: 0; padding: 10px; border-radius: 8px; background: var(--code-bg); color: var(--code-fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
      line-height: 1.5; overflow: auto; max-height: 265px; white-space: pre-wrap;
    }
    .subtabs { display: flex; flex-wrap: wrap; gap: 5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="btn-group">
        <button id="mode-flow" class="active" onclick="switchMode('flow')">📋 1. messages[] 报文流转抓包</button>
        <button id="mode-code" onclick="switchMode('code')">🔍 2. 67 行源码四大积木透视</button>
      </div>
      <div id="flow-controls" class="btn-group">
        <button id="bug-btn" class="danger" onclick="toggleBug()">💥 故障注入: 漏写 append(reply)</button>
        <span id="step-badge" class="badge">1 / 4</span>
        <button id="btn-prev" onclick="moveStep(-1)">← 上一步</button>
        <button id="btn-next" class="primary" onclick="moveStep(1)">下一步 →</button>
      </div>
    </div>

    <div id="subtab-bar" class="subtabs"></div>

    <div class="cols">
      <div class="panel" id="left-panel"></div>
      <div class="panel" id="right-panel"></div>
    </div>
  </div>

  <script>
    let mode = 'flow';
    let stepIdx = 0;
    let codeIdx = 0;
    let bugOn = false;

    const FLOW_STEPS = [
      {
        tab: 'Step 1 · 用户提问',
        actor: '👤 本地 → API',
        title: '发送初始 messages[1] + 顶层 TOOLS 菜单',
        desc: '黑板上只有 1 条 user 消息。同时 HTTP 请求体携带 TOOLS JSON Schema，告诉云端大脑本地有 get_weather 和 calc 两个函数。',
        note: '💡 无状态铁律：TOOLS 不在 messages 数组里，而是同级顶层字段，且每一轮请求都必须重复携带。',
        messages: [
          { role: 'user', content: '杭州今天几度？如果低于 20 度帮我算算差几度到 20 度。' }
        ]
      },
      {
        tab: 'Step 2 · 模型开点单条',
        actor: '🧠 云端 API → 本地',
        title: '模型暂不回答 (content=null)，开出 tool_calls',
        desc: '模型发现需要实时天气，于是返回一张 JSON 点单条：指定函数名 get_weather、JSON 字符串参数，以及唯一取餐号 call_9x8a。',
        note: '🔑 核心细节：大模型只负责“填点单表”，绝不会在云端执行任何 Python 代码！',
        messages: [
          { role: 'user', content: '杭州今天几度？如果低于 20 度帮我算算差几度到 20 度。' },
          {
            role: 'assistant',
            content: null,
            tool_calls: [
              { id: 'call_9x8a', type: 'function', function: { name: 'get_weather', arguments: '{"city": "杭州"}' } }
            ]
          }
        ]
      },
      {
        tab: 'Step 3 · 本地执行 & 对暗号',
        actor: '⚙️ 本地 Python → 黑板',
        title: 'TOOL_MAP 跑真函数，贴着 tool_call_id 塞回黑板',
        desc: '本地拦截到点单条，执行 get_weather(city="杭州") 拿到 "14°C，晴"，追加 role="tool" 并原样回传 tool_call_id="call_9x8a"。',
        note: '⚠️ 试着点击右上角「💥 故障注入」按钮，看看如果第 50 行漏掉了 messages.append(reply) 会发生什么！',
        messages: [
          { role: 'user', content: '杭州今天几度？如果低于 20 度帮我算算差几度到 20 度。' },
          {
            role: 'assistant',
            content: null,
            tool_calls: [
              { id: 'call_9x8a', type: 'function', function: { name: 'get_weather', arguments: '{"city": "杭州"}' } }
            ]
          },
          { role: 'tool', tool_call_id: 'call_9x8a', content: '14°C，晴' }
        ]
      },
      {
        tab: 'Step 4 · 二轮计算 & 交卷',
        actor: '✅ 循环终止 (6 条定格)',
        title: '二轮点单 calc("20 - 14") 后输出最终回答',
        desc: '第 2 轮模型看到 14°C < 20°C，再开单 calc 拿到 "6"；第 3 轮模型不再返回 tool_calls，for 循环正式退出！',
        note: '📈 消息数按 1 → 3 → 5 → 6 阶梯上涨，两对连体婴 (call_9x8a / call_2b7f) 严丝合缝留在黑板上。',
        messages: [
          { role: 'user', content: '杭州今天几度？如果低于 20 度帮我算算差几度到 20 度。' },
          { role: 'assistant', content: null, tool_calls: [{ id: 'call_9x8a', type: 'function', function: { name: 'get_weather', arguments: '{"city": "杭州"}' } }] },
          { role: 'tool', tool_call_id: 'call_9x8a', content: '14°C，晴' },
          { role: 'assistant', content: null, tool_calls: [{ id: 'call_2b7f', type: 'function', function: { name: 'calc', arguments: '{"expr": "20 - 14"}' } }] },
          { role: 'tool', tool_call_id: 'call_2b7f', content: '6' },
          { role: 'assistant', content: '杭州今天 14°C（晴），低于 20°C，距离 20°C 还差 6 度。' }
        ]
      }
    ];

    const CODE_MODULES = [
      {
        tab: '① 本地手脚 (L4–11)',
        loc: 'mini_react_agent.py · 第 4–11 行',
        title: '干活真函数 + TOOL_MAP 字符串路由字典',
        desc: '云端模型只吐出函数名字符串 "get_weather"，本地必须靠 TOOL_MAP 字典映射到真实函数对象；返回值一律转 str 以便塞入 JSON。',
        note: '🔌 MCP 伏笔：如果有 50 个外部工具，手写函数 + 路由字典会累死——MCP 就是把这套注册与调用跨进程标准化了。',
        code: `def get_weather(city: str) -> str:
    return {"杭州": "14°C，晴", "北京": "8°C，多云"}.get(city, "22°C，阴")

def calc(expr: str) -> str:
    return str(eval(expr, {"__builtins__": {}}))

TOOL_MAP = {"get_weather": get_weather, "calc": calc}`
      },
      {
        tab: '② 工具菜单 (L14–19)',
        loc: 'mini_react_agent.py · 第 14–19 行',
        title: 'TOOLS JSON Schema（给大脑看的点菜菜单）',
        desc: '大模型看不见你的 .py 源码，全靠读 description 判断何时调哪个工具，靠 parameters JSON Schema 填对参数名和类型。',
        note: '⚠️ 踩坑点：description 写得含糊不清时，模型极易选错工具或干脆凭记忆幻觉作答。',
        code: `TOOLS = [
  {"type": "function", "function": {
    "name": "get_weather",
    "description": "查城市实时天气",
    "parameters": {
      "type": "object",
      "properties": {"city": {"type": "string"}},
      "required": ["city"]
    }
  }}, ...
]`
      },
      {
        tab: '③ 大脑通信 (L21–42)',
        loc: 'mini_react_agent.py · 第 21–42 行',
        title: '剥掉 SDK 外衣：本质就是一次 HTTP POST',
        desc: '把 model + 整块 messages 黑板 + TOOLS 菜单打包发给 /chat/completions，拆开响应体取 choices[0]["message"] 即可。',
        note: '💰 账单真相：每一轮请求都把整块不断变长的 messages[] 重新发一遍！',
        code: `body = json.dumps({
    "model": model,
    "messages": messages,  # 整块黑板历史
    "tools": TOOLS         # 工具菜单
}).encode()
req = urllib.request.Request(url, data=body, headers={
    "Authorization": f"Bearer {api_key}",
    "Content-Type": "application/json"
})
with urllib.request.urlopen(req, timeout=30) as resp:
    return json.loads(resp.read())["choices"][0]["message"]`
      },
      {
        tab: '④ 心脏循环 (L45–62)',
        loc: 'mini_react_agent.py · 第 45–62 行',
        title: '18 行 ReAct 引擎 + max_steps 保险丝',
        desc: '先原样贴上 reply → 检查有无 tool_calls 决定是否交卷 → json.loads 拆解参数字符串 → 本地跑函数并绑上 tool_call_id 塞回黑板。',
        note: '🔥 核心铁律：第 50 行 messages.append(reply) 绝不可省！assistant(tool_calls) 与 tool(tool_call_id) 是受协议锁死的原子连体婴。',
        code: `messages = [{"role": "user", "content": user_prompt}]
for step in range(1, max_steps + 1):        # 保险丝：防死循环
    reply = call_llm(messages)
    messages.append(reply)                  # ① 原样贴上模型回复
    if not reply.get("tool_calls"):         # ② 没点单 = 交卷退出
        return messages
    for tc in reply["tool_calls"]:          # ③ 遍历点单条 (支持并发多单!)
        fn_args = json.loads(tc["function"]["arguments"])
        obs = TOOL_MAP[tc["function"]["name"]](**fn_args)
        messages.append({
            "role": "tool", "tool_call_id": tc["id"], "content": obs
        })`
      }
    ];

    function switchMode(m) {
      mode = m;
      document.getElementById('mode-flow').className = m === 'flow' ? 'active' : '';
      document.getElementById('mode-code').className = m === 'code' ? 'active' : '';
      document.getElementById('flow-controls').style.display = m === 'flow' ? 'flex' : 'none';
      render();
    }

    function moveStep(delta) {
      stepIdx = Math.max(0, Math.min(FLOW_STEPS.length - 1, stepIdx + delta));
      render();
    }

    function toggleBug() {
      bugOn = !bugOn;
      if (bugOn && stepIdx < 2) stepIdx = 2;
      render();
    }

    function render() {
      const subBar = document.getElementById('subtab-bar');
      const left = document.getElementById('left-panel');
      const right = document.getElementById('right-panel');

      if (mode === 'flow') {
        const s = FLOW_STEPS[stepIdx];
        document.getElementById('step-badge').textContent = `${stepIdx + 1} / ${FLOW_STEPS.length}`;
        document.getElementById('btn-prev').disabled = stepIdx === 0;
        document.getElementById('btn-next').disabled = stepIdx === FLOW_STEPS.length - 1;
        document.getElementById('bug-btn').className = bugOn ? 'danger on' : 'danger';

        subBar.innerHTML = FLOW_STEPS.map((it, i) =>
          `<button class="${i === stepIdx ? 'active' : ''}" onclick="stepIdx=${i};render()">${it.tab}</button>`
        ).join('');

        const showErr = bugOn && stepIdx >= 2;
        const displayMsgs = showErr
          ? [
              FLOW_STEPS[2].messages[0],
              // assistant(tool_calls) intentionally omitted!
              FLOW_STEPS[2].messages[2]
            ]
          : s.messages;

        left.innerHTML = `
          <div class="panel-head">
            <span class="tag">${showErr ? '🚨 API 网关拦截' : s.actor}</span>
            <span class="badge">messages 长度: ${displayMsgs.length}</span>
          </div>
          <div class="title">${showErr ? '删掉 messages.append(reply) 后直接崩溃！' : s.title}</div>
          <p class="desc">${showErr
            ? '因为漏贴了前置的 assistant(tool_calls) 点单条，孤零零的 role="tool" 紧跟在 user 后面。下一轮请求根本进不了 GPU，被云端 API 网关当场拦回 HTTP 400！'
            : s.desc}</p>
          ${showErr
            ? `<div class="err-box">HTTP 400 Bad Request:<br/>Invalid parameter: messages with role 'tool' must be a response to a preceding message with 'tool_calls'.</div>`
            : `<div class="note-box">${s.note}</div>`}
        `;

        right.innerHTML = `
          <div class="panel-head">
            <span style="font-size:12px;font-weight:700;">messages[] 实时 JSON 快照</span>
            <span class="badge">${showErr ? '❌ 缺失父节点 call_9x8a' : '✅ 协议合法'}</span>
          </div>
          <pre>${JSON.stringify(displayMsgs, null, 2)}</pre>
        `;
      } else {
        const c = CODE_MODULES[codeIdx];
        subBar.innerHTML = CODE_MODULES.map((it, i) =>
          `<button class="${i === codeIdx ? 'active' : ''}" onclick="codeIdx=${i};render()">${it.tab}</button>`
        ).join('');

        left.innerHTML = `
          <div class="panel-head">
            <span class="tag">${c.loc}</span>
          </div>
          <div class="title">${c.title}</div>
          <p class="desc">${c.desc}</p>
          <div class="note-box">${c.note}</div>
        `;

        right.innerHTML = `
          <div class="panel-head">
            <span style="font-size:12px;font-weight:700;">源码片段</span>
            <span class="badge">Python 标准库 · 零依赖</span>
          </div>
          <pre>${c.code.replace(/</g, '&lt;')}</pre>
        `;
      }
    }

    render();
  </script>
</body>
</html>
